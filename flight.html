<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Ticket Booking</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .booking-form {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 500px;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-family: 'Tangerine', serif;
      border-bottom: #667eea solid 3px;
      border-radius: 10%;
      font-size: 50px;
    }

    label {
      font-size: 16px;
      color: #555;
      margin-bottom: 8px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      transition: 0.3s;
    }

    input:focus, select:focus {
      border-color: #4facfe;
      box-shadow: 0 0 8px rgba(79, 172, 254, 0.5);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.4s;
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.5);
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #764ba2, #667eea);
      transform: scale(1.05);
    }

    #price {
      text-align: center;
      font-size: 20px;
      color: #444;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* Preloader Styles */
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #cce7ff;
  border-top: 6px solid #007bff; /* Blue spinner color */
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

  </style>
</head>


<body>

  <!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>
  <form class="booking-form" onsubmit="return saveDataAndGoToReceipt()" method="POST">
    <h2>Book Your Flight</h2>
    
    <label for="from">From</label>
    <select id="from" name="from" required onchange="calculatePrice()">
      <option value="" disabled selected>Select Departure City</option>
      <option value="Delhi">Delhi</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Bangalore">Bangalore</option>
      <option value="Chennai">Chennai</option>
      <option value="Kolkata">Kolkata</option>
      <option value="Hyderabad">Hyderabad</option>
      <option value="Ahmedabad">Ahmedabad</option>
      <option value="Pune">Pune</option>
      <option value="Jaipur">Jaipur</option>
      <option value="Lucknow">Lucknow</option>
      <option value="Goa">Goa</option>
      <option value="Chandigarh">Chandigarh</option>
      <option value="Cochin">Cochin</option>
      <option value="Guwahati">Guwahati</option>
      <option value="Patna">Patna</option>
      <option value="Bhubaneswar">Bhubaneswar</option>
      <option value="Indore">Indore</option>
      <option value="Nagpur">Nagpur</option>
      <option value="Varanasi">Varanasi</option>
      <option value="Thiruvananthapuram">Thiruvananthapuram</option>
      <option value="Madurai">Madurai</option>
      <option value="Coimbatore">Coimbatore</option>
      <option value="Visakhapatnam">Visakhapatnam</option>
      <option value="Vadodara">Vadodara</option>
      <option value="Mangalore">Mangalore</option>
      <option value="Raipur">Raipur</option>
      <option value="Ranchi">Ranchi</option>
      <option value="Srinagar">Srinagar</option>
      <option value="Amritsar">Amritsar</option>
      <option value="Dehradun">Dehradun</option>
      <option value="Agartala">Agartala</option>
      <option value="Imphal">Imphal</option>
      <option value="Shillong">Shillong</option>
      <option value="Port Blair">Port Blair</option>
      <option value="Jammu">Jammu</option>
      <option value="Leh">Leh</option>
      <!-- Options here -->
    </select>
    
    <label for="to">To</label>
    <select id="to" name="to" required onchange="calculatePrice()">
      <option value="" disabled selected>Select Destination City</option>
      <option value="Delhi">Delhi</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Bangalore">Bangalore</option>
      <option value="Chennai">Chennai</option>
      <option value="Kolkata">Kolkata</option>
      <option value="Hyderabad">Hyderabad</option>
      <option value="Ahmedabad">Ahmedabad</option>

      <option value="Lucknow">Lucknow</option>

      <option value="Cochin">Cochin</option>
      <option value="Guwahati">Guwahati</option>
      <option value="Patna">Patna</option>
      <option value="Bhubaneswar">Bhubaneswar</option>
      <option value="Indore">Indore</option>
      <option value="Nagpur">Nagpur</option>
      <option value="Varanasi">Varanasi</option>
      <option value="Thiruvananthapuram">Thiruvananthapuram</option>
      <option value="Madurai">Madurai</option>
      <option value="Coimbatore">Coimbatore</option>
      <option value="Visakhapatnam">Visakhapatnam</option>
      <option value="Vadodara">Vadodara</option>
      <option value="Mangalore">Mangalore</option>
      <option value="Raipur">Raipur</option>
      <option value="Ranchi">Ranchi</option>
      <option value="Srinagar">Srinagar</option>
      <option value="Amritsar">Amritsar</option>
      <option value="Dehradun">Dehradun</option>
      <option value="Agartala">Agartala</option>
      <option value="Imphal">Imphal</option>
      <option value="Shillong">Shillong</option>
      <option value="Port Blair">Port Blair</option>
      <option value="Jammu">Jammu</option>
      <option value="Leh">Leh</option>
      <!-- Options here -->
    </select>
    
    <label for="departure">Departure Date</label>
    <input type="date" id="departure" name="departure" required>
    
    <label for="return">Return Date</label>
    <input type="date" id="return" name="return">
    
    <label for="passengers">Passengers</label>
    <select id="passengers" name="passengers" required onchange="updatePassengerFields(); calculatePrice()">
      <option value="" disabled selected>Select passengers</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4+</option>
    </select>
    
    <div id="passengerNames" style="display:none;">
      <div id="passengerInputFields"></div>
    </div>
    
    <label for="class">Class</label>
    <select id="class" name="class" required onchange="calculatePrice()">
      <option value="" disabled selected>Select class</option>
      <option value="Economy">Economy</option>
      <option value="Business">Business</option>
      <option value="First">First Class</option>
    </select>
    
    <div id="price">Total Price: ₹0</div>
    
    <button type="submit" class="submit-btn">Book Flight</button>
  </form>



  <script>
    function updatePassengerFields() {
      const passengerCount = parseInt(document.getElementById('passengers').value);
      const passengerInputFields = document.getElementById('passengerInputFields');
      passengerInputFields.innerHTML = '';

      if (passengerCount > 0) {
        document.getElementById('passengerNames').style.display = 'block';
        for (let i = 1; i <= passengerCount; i++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = `passenger${i}`;
          input.name = `passenger${i}`;
          input.placeholder = `Passenger ${i} Name`;
          input.required = true;
          passengerInputFields.appendChild(input);
        }
      } else {
        document.getElementById('passengerNames').style.display = 'none';
      }
    }

    function saveDataAndGoToReceipt() {
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const departure = document.getElementById('departure').value;
      const returnDate = document.getElementById('return').value;
      const passengers = document.getElementById('passengers').value;
      const flightClass = document.getElementById('class').value;
      const passengerNames = [];

      for (let i = 1; i <= passengers; i++) {
        const passengerName = document.getElementById(`passenger${i}`).value;
        passengerNames.push(passengerName);
      }

      const flightData = {
        from,
        to,
        departure,
        returnDate,
        passengers,
        flightClass,
        passengerNames,
        totalPrice: document.getElementById('price').innerText
      };

      localStorage.setItem('flightData', JSON.stringify(flightData));
      window.location.href = "receipt.html";
      return false;
    }

    function calculatePrice() {
      // Add logic to calculate price based on selections
      document.getElementById('price').innerText = "5000"; // Example
    }
  </script>
  <script>
    // Preloader removal
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      preloader.style.opacity = '0';
      preloader.style.transition = 'opacity 0.5s ease';
      setTimeout(() => {
        preloader.style.display = 'none';
      }, 500); // Wait for the fade-out transition
    });
  </script>
  
</body>
</html>
