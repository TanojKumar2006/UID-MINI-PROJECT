<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Booking Receipt</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <style>
/* Main Styles */
body {
  margin: 0;
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  background:linear-gradient(135deg, #81d4f0, #d0eaff, #3a5d74);
  color: #333;
}

.container {
  max-width: 600px;
  margin: 100px auto 50px;
  background: #ffffff;
  padding: 40px 30px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  border-radius: 20px;
  text-align: center;
}

.container h1 {
  font-size: 50px;
  margin-bottom: 30px;
  color: #007bff;
  font-family:  'Tangerine', serif;
  font-weight: 700;
  border-bottom: #003d80 solid 3px;
  border-radius: 10%;
}

.receipt-details {
  margin-top: 20px;
  text-align: left;
}

.details {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
  padding: 10px;
  background: #f0f8ff;
  border-radius: 10px;
}

.total {
  margin-top: 30px;
  background:linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
  color: rgb(11, 68, 202);
  padding: 15px;
  border-radius: 15px;
  font-size: 20px;
  font-weight: bold;
}

.thank-you {
  margin-top: 40px;
  font-size: 16px;
  color: #555;
}

.thank-you p {
  margin: 8px 0;
}

.button-group {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 20px;
}

.back-btn {
  display: inline-block;
  padding: 12px 24px;
  background: linear-gradient(135deg, #007bff, #0056b3);
  color: #ffffff;
  text-decoration: none;
  border-radius: 30px;
  font-size: 16px;
  font-weight: 500;
  box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
  transition: background 0.3s ease, transform 0.3s ease;
}

.back-btn:hover {
  background: linear-gradient(135deg, #0056b3, #003d80);
  transform: translateY(-2px);
}

.footer {
  margin-top: 50px;
  padding: 20px;
  text-align: center;
  font-size: 14px;
  color: #f95300;
  background-color: black;
}
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #cce7ff;
  border-top: 6px solid #007bff; /* Blue spinner color */
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
  </style>
</head>

<body>
    <!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>


  <div class="container">
    <h1>Event Booking Receipt</h1>

    <div class="receipt-details">
      <div class="details">
        <span><strong>Event:</strong></span>
        <span id="eventName"></span>
      </div>
      <div class="details">
        <span><strong>Price:</strong></span>
        <span id="eventPrice"></span>
      </div>
      <div class="details">
        <span><strong>Date:</strong></span>
        <span id="eventDate"></span>
      </div>
      <div class="details">
        <span><strong>Time:</strong></span>
        <span id="eventTime"></span>
      </div>
      <div class="details">
        <span><strong>Venue:</strong></span>
        <span id="eventVenue"></span>
      </div>

      <div class="total">
        <p><strong>Total Amount:</strong> ₹<span id="totalPrice"></span></p>
      </div>
    </div>

    <div class="thank-you">
      <p>Thank you for booking with EventHub!</p>
      <p>Your booking is confirmed. We look forward to seeing you at the event.</p>
    </div>

    <!-- Correct Button Group -->
    <div class="button-group">
      <a href="finaltransaction.html" class="back-btn">Confirm Purchase</a>
      <a href="transactioncancelled.html" class="back-btn">Cancel Booking</a>
    </div>
  </div>

  <div class="footer">
    <p>© 2025 EventHub. All rights reserved.</p>
  </div>

  <script>
    // Retrieve booking details from localStorage
    const eventName = localStorage.getItem('eventName');
    const eventPrice = localStorage.getItem('eventPrice');

    // Define static values for event details (you can enhance this to dynamically show date, time, and venue)
    const eventDetails = {
      "Coldplay Concert": { date: "May 25, 2025", time: "7:00 PM", venue: "Marina Stadium" },
      "Stand-up Comedy Night": { date: "June 5, 2025", time: "8:30 PM", venue: "City Hall" },
      "Football Finals": { date: "June 10, 2025", time: "5:00 PM", venue: "National Sports Arena" },
      "Art & Craft Exhibition": { date: "June 15, 2025", time: "11:00 AM", venue: "Art Gallery City Center" },
      "DJ Night Party": { date: "June 20, 2025", time: "9:00 PM", venue: "Club Infinity" },
      "Food Carnival": { date: "June 25, 2025", time: "1:00 PM", venue: "Central Park" },
      "Book Fair": { date: "July 1, 2025", time: "10:00 AM", venue: "Expo Center" },
      "Tech Conference 2025": { date: "July 10, 2025", time: "9:00 AM", venue: "Tech World Convention Center" }
    };

    // Set the event details dynamically
    document.getElementById('eventName').innerText = eventName;
    document.getElementById('eventPrice').innerText = `₹${eventPrice}`;
    
    const details = eventDetails[eventName];
    if (details) {
      document.getElementById('eventDate').innerText = details.date;
      document.getElementById('eventTime').innerText = details.time;
      document.getElementById('eventVenue').innerText = details.venue;
    }

    // Set the total price
    document.getElementById('totalPrice').innerText = eventPrice;
  </script>
    <script>
      // Preloader removal
      window.addEventListener('load', () => {
        const preloader = document.getElementById('preloader');
        preloader.style.opacity = '0';
        preloader.style.transition = 'opacity 0.5s ease';
        setTimeout(() => {
          preloader.style.display = 'none';
        }, 500); // Wait for the fade-out transition
      });
    </script>

</body>

</html>
