<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction Receipt</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
  
    body {
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
  
    .receipt-container {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 550px;
      animation: fadeIn 1s ease;
    }
  
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  
    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-size: 32px;
      font-family: 'Tangerine', serif;
      border-bottom: #05bac0 solid 3px;
      border-radius: 10%;
      font-size: 50px;
    }
  
    .details {
      font-size: 18px;
      margin-bottom: 15px;
      color: #555;
      padding: 12px 20px;
      border-radius: 10px;
    }
  
    .details span {
      font-weight: bold;
      color: #222;
    }
  
    .total-price {
      font-size: 22px;
      margin-bottom: 25px;
      font-weight: bold;
      text-align: center;
      color: #2c3e50;
    }
  
    .button {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
  
    .back-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #66a6ff, #89f7fe);
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 10px 20px rgba(102, 166, 255, 0.5);
      transition: 0.4s;
    }
  
    .back-btn:hover {
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      transform: scale(1.05);
    }
  
    /* Preloader Styles */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
  
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #cce7ff;
      border-top: 6px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
  
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  </head>
<body>
    <!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>


  <div class="receipt-container">
    <h2>Transaction Receipt</h2>

    <div class="details">
      <span>From Port: </span><span id="fromPortDisplay"></span>
    </div>
    <div class="details">
      <span>To Port: </span><span id="toPortDisplay"></span>
    </div>
    <div class="details">
      <span>Sailing Date: </span><span id="dateDisplay"></span>
    </div>
    <div class="details">
      <span>Number of Passengers: </span><span id="passengerDisplay"></span>
    </div>
    <div class="details">
      <span>Cabin Type: </span><span id="cabinTypeDisplay"></span>
    </div>

    <div class="total-price" id="priceDisplay">Total Price: ₹0</div>

    <div class="button">
      <a href="finaltransaction.html" class="back-btn">Confirm Purchase</a>
      <a href="transactioncancelled.html" class="back-btn">Cancel Booking</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Retrieve the data from localStorage
      const fromPort = localStorage.getItem('fromPort');
      const toPort = localStorage.getItem('toPort');
      const date = localStorage.getItem('date');
      const passengers = localStorage.getItem('passengers');
      const cabinType = localStorage.getItem('cabinType');
      const price = localStorage.getItem('price');

      if (fromPort && toPort && date && passengers && cabinType && price) {
        document.getElementById('fromPortDisplay').textContent = fromPort;
        document.getElementById('toPortDisplay').textContent = toPort;
        document.getElementById('dateDisplay').textContent = date;
        document.getElementById('passengerDisplay').textContent = passengers;
        document.getElementById('cabinTypeDisplay').textContent = cabinType;
        document.getElementById('priceDisplay').textContent = "Total Price: ₹" + price;
    } else {
        alert("No booking details found.");
      }
    });

    // Go back to booking page
    function goBack() {
      window.location.href = "finaltransaction.html"; // Redirect back to the ship booking page
    }

    // Cancel the booking
      function Cancel() {
      window.location.href = "transactioncancelled.html"; // Redirect back to the ship booking page
    }
  </script>
  <script>
    // Preloader removal
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      preloader.style.opacity = '0';
      preloader.style.transition = 'opacity 0.5s ease';
      setTimeout(() => {
        preloader.style.display = 'none';
      }, 500); // Wait for the fade-out transition
    });
  </script>
</body>
</html>
