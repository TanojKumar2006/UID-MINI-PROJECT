<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction Successful</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #56ab2f, #a8e063);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      padding: 50px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      animation: slideDown 1s ease;
      max-width: 500px;
      width: 100%;
    }
    
    @keyframes slideDown {
      0% {
        opacity: 0;
        transform: translateY(-50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h1 {
      color: #43a047;
      font-size: 36px;
      margin-bottom: 20px;
    }
    
    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }
    
    .back-btn {
      padding: 15px 30px;
      background: linear-gradient(135deg, #43a047, #66bb6a);
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 50px;
      transition: all 0.4s ease;
      box-shadow: 0 8px 20px rgba(67, 160, 71, 0.5);
    }
    
    .back-btn:hover {
      background: linear-gradient(135deg, #66bb6a, #43a047);
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(67, 160, 71, 0.6);
    }

    img {
      width: 120px;
      margin-bottom: 20px;
    }
        /* Preloader Styles */
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #cce7ff;
  border-top: 6px solid #007bff; /* Blue spinner color */
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
  </style>
</head>

<body>
    <!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>


  <div class="container">
    <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" alt="Success">
    <h1>Transaction Successful</h1>
    <p>Congratulations! Your payment was completed successfully. <br> Thank you for booking with us!</p>
    <a href="home.html" class="back-btn">Back to Home</a>
  </div>
  <script>
    // Preloader removal
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      preloader.style.opacity = '0';
      preloader.style.transition = 'opacity 0.5s ease';
      setTimeout(() => {
        preloader.style.display = 'none';
      }, 500); // Wait for the fade-out transition
    });
  </script>
</body>
</html>
