<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Receipt</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .receipt {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      padding: 40px 30px;
      width: 100%;
      max-width: 800px;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #03726f;
      font-weight: bold;
      border-bottom: 2px solid #6687ff;
      padding-bottom: 10px;
      font-family: 'Tangerine', serif;
      border-radius: 10%;
      font-size: 50px;
    }

    .details {
      font-size: 18px;
      color: #555;
      margin-bottom: 20px;
    }

    .details p {
      margin: 10px 0;
      line-height: 1.6;
    }

    .details strong {
      color: #222;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, #66a6ff, #89f7fe);
      color: white;
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 20px rgba(102, 166, 255, 0.4);
      cursor: pointer;
      transition: 0.4s;
      margin-top: 30px;
    }

    button:hover {
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      transform: scale(1.05);
    }

    /* Preloader Styles */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #cce7ff;
      border-top: 6px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    
/* Buttons */
.back-btn {
    display: inline-block;
    text-align: center;
    margin: 10px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 30px;
    background: linear-gradient(135deg, #5fb7ff, #7be6fe);
    color: white;
    border-radius: 50px;
    box-shadow: 0 5px 15px rgba(9, 80, 112, 0.5);
    transition: background 0.3s ease, transform 0.3s ease;
  }

  .back-btn:hover {
    background: linear-gradient(135deg, #0a4678, #098ecb);
    transform: scale(1.05);
  }

  </style>
</head>
<body>

<!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>

<div class="receipt">
  <h2>Transaction Receipt</h2>
  <div id="receiptDetails" class="details">
    <!-- Flight details will be populated here -->
  </div>
  <a href="FLIGHT.html" class="back-btn">Go Back to Booking</a>
  <a href="finaltransaction.html" class="back-btn">Confirm Purchase</a>
  <a href="transactioncancelled.html" class="back-btn">Cancel Booking</a>
</div>

<script>
  // Display transaction details
  function displayReceipt() {
    const flightData = JSON.parse(localStorage.getItem('flightData'));

    if (!flightData) {
      alert("No flight data found!");
      return;
    }

    const receiptDetails = document.getElementById('receiptDetails');

    const receiptContent = `
      <p><strong>Departure City:</strong> ${flightData.from}</p>
      <p><strong>Destination City:</strong> ${flightData.to}</p>
      <p><strong>Departure Date:</strong> ${flightData.departure}</p>
      <p><strong>Return Date:</strong> ${flightData.returnDate || "N/A"}</p>
      <p><strong>Class:</strong> ${flightData.flightClass}</p>
      <p><strong>Passengers:</strong> ${flightData.passengers}</p>
      <p><strong>Passenger Names:</strong> ${flightData.passengerNames.join(', ')}</p>
      <p><strong>Total Price:</strong> ₹${flightData.totalPrice}</p>
    `;

    receiptDetails.innerHTML = receiptContent;
  }

  window.addEventListener('load', () => {
    const preloader = document.getElementById('preloader');
    preloader.style.opacity = '0';
    preloader.style.transition = 'opacity 0.5s ease';
    setTimeout(() => {
      preloader.style.display = 'none';
      displayReceipt(); // Load the receipt after preloader hides
    }, 500);
  });
</script>

</body>
</html>
