<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction Receipt</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .receipt-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      max-width: 700px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #333;
      font-family: 'Tangerine', serif;
      border-bottom: #ffa751 solid 3px;
      border-radius: 10%;
      font-size: 50px;
    }

    .details {
    margin-bottom: 20px;
    font-size: 18px;
    color: #444;
    padding: 10px;
    background: #f9fcff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 91, 187, 0.08);
    transition: transform 0.3s;
  }

  .details:hover {
    transform: translateY(-3px);
  }

  .details label {
    font-weight: 600;
    color: #333;
  }

  .details div {
    margin-bottom: 8px;
  }
  /* Price Section */
  .price {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #ff5e00;
    margin: 20px 0;
  }

/* Buttons */
.back-btn {
    display: inline-block;
    text-align: center;
    margin: 10px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 30px;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    color: white;
    border-radius: 50px;
    box-shadow: 0 5px 15px rgba(255, 126, 95, 0.5);
    transition: background 0.3s ease, transform 0.3s ease;
  }

  .back-btn:hover {
    background: linear-gradient(135deg, #feb47b, #ff7e5f);
    transform: scale(1.05);
  }

  .button-group {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }
        /* Preloader Styles */
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #cce7ff;
  border-top: 6px solid #007bff; /* Blue spinner color */
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
  </style>
</head>
<body>
    <!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>


  <div class="receipt-container">
    <h2>Transaction Receipt</h2>
    <div class="details">
      <div><label>From City:</label> <span id="fromCity"></span></div>
      <div><label>To City:</label> <span id="toCity"></span></div>
      <div><label>Travel Date:</label> <span id="travelDate"></span></div>
      <div><label>Bus Type:</label> <span id="busType"></span></div>
      <div><label>Passengers:</label> <span id="passengersCount"></span></div>
      <div><label>Passenger Names:</label> <span id="passengerNames"></span></div>
    </div>
    <div class="price" id="totalPrice"></div>
    <a href="bus.html" class="back-btn">Go Back to Booking</a>
    <a href="finaltransaction.html" class="back-btn">Confirm Purchase</a>
    <a href="transactioncancelled.html" class="back-btn">Cancel Booking</a>



  </div>

  <script>
    const bookingData = JSON.parse(localStorage.getItem('busBookingData'));

    if (bookingData) {
      document.getElementById('fromCity').textContent = bookingData.fromCity;
      document.getElementById('toCity').textContent = bookingData.toCity;
      document.getElementById('travelDate').textContent = bookingData.travelDate;
      document.getElementById('busType').textContent = bookingData.busType;
      document.getElementById('passengersCount').textContent = bookingData.passengers;
      document.getElementById('passengerNames').textContent = bookingData.passengerNames.join(', ');
      document.getElementById('totalPrice').textContent = `Total Price: ₹${bookingData.totalPrice}`;
    } else {
      document.querySelector('.receipt-container').innerHTML = '<p>No booking data found.</p>';
    }
  </script>
    <script>
      // Preloader removal
      window.addEventListener('load', () => {
        const preloader = document.getElementById('preloader');
        preloader.style.opacity = '0';
        preloader.style.transition = 'opacity 0.5s ease';
        setTimeout(() => {
          preloader.style.display = 'none';
        }, 500); // Wait for the fade-out transition
      });
    </script>

</body>
</html>
