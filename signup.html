<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - TicketGo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('signup.jpg'); /* Add your background image */
      background-size: cover;
      background-position: center;
      padding: 20px;
    }

    .signup-container {
      padding: 50px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      animation: fadeIn 1.5s ease-in-out;
      text-align: center;
      backdrop-filter: blur(10px); /* Optional: for a frosted glass effect */
      -webkit-backdrop-filter: blur(10px); /* Safari support */
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      font-size: 30px;
      color: #333;
      margin-bottom: 30px;
      animation: slideIn 1s ease-in-out;
      border-bottom: #007bff solid 3px;
      border-radius: 10%;
    }

    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateX(-100px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #666;
      font-size: 16px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      transition: 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #6c5ce7;
      outline: none;
      box-shadow: 0 0 8px rgba(108, 92, 231, 0.3);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      margin-top: 15px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #43cea2, #185a9d);
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(67, 206, 162, 0.5);
    }

    .bottom-text {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .bottom-text a {
      color: #6c5ce7;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .bottom-text a:hover {
      color: #43cea2;
    }
        /* Preloader Styles */
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #cce7ff;
  border-top: 6px solid #007bff; /* Blue spinner color */
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

  </style>
</head>
<body>
    <!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>


  <div class="signup-container">
    <h2>Create Your Account</h2>
    <form>
      <div class="form-group">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Create Password:</label>
        <input type="password" id="password" placeholder="Create a password" required>
      </div>

      <button type="submit" class="btn">Sign Up</button>

      <div class="bottom-text">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </form>
  </div>
  <script>
    // Preloader removal
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      preloader.style.opacity = '0';
      preloader.style.transition = 'opacity 0.5s ease';
      setTimeout(() => {
        preloader.style.display = 'none';
      }, 500); // Wait for the fade-out transition
    });
  </script>
</body>
</html>
