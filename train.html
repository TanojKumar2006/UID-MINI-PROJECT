<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train Ticket Booking</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #c3cfe2, #c3cfe2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .booking-form {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 550px;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-family: 'Tangerine', serif;
      border-bottom: #7451ff solid 3px;
      border-radius: 10%;
      font-size: 50px;
    }

    label {
      font-size: 16px;
      color: #555;
      margin-bottom: 8px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      transition: 0.3s;
    }

    input:focus, select:focus {
      border-color: #4facfe;
      box-shadow: 0 0 8px rgba(79, 172, 254, 0.5);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.4s;
      box-shadow: 0 10px 20px rgba(255, 117, 140, 0.5);
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      transform: scale(1.05);
    }

    #price {
      text-align: center;
      font-size: 20px;
      color: #444;
      margin-bottom: 20px;
      font-weight: bold;
    }

    #passengerNames {
      margin-bottom: 20px;
    }
        /* Preloader Styles */
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #cce7ff;
  border-top: 6px solid #007bff; /* Blue spinner color */
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
  </style>
</head>

<body>
    <!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>


  <form class="booking-form" onsubmit="return goToLoadingPage()" method="POST">
    <h2>Train Ticket Booking</h2>

    <label for="fromStation">From Station</label>
    <select id="fromStation" name="fromStation" required onchange="calculateTrainPrice()">
      <option value="" disabled selected>Select Departure Station</option>
    </select>

    <label for="toStation">To Station</label>
    <select id="toStation" name="toStation" required onchange="calculateTrainPrice()">
      <option value="" disabled selected>Select Destination Station</option>
    </select>

    <label for="date">Travel Date</label>
    <input type="date" id="date" name="date" required>

    <label for="passengers">Passengers</label>
    <select id="passengers" name="passengers" required onchange="updatePassengerFields(); calculateTrainPrice()">
      <option value="" disabled selected>Select passengers</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4+</option>
    </select>

    <div id="passengerNames" style="display:none;">
      <div id="passengerInputFields"></div>
    </div>

    <label for="classType">Class</label>
    <select id="classType" name="classType" required onchange="calculateTrainPrice()">
      <option value="" disabled selected>Select Class</option>
      <option value="Sleeper">Sleeper</option>
      <option value="3AC">3AC</option>
      <option value="2AC">2AC</option>
      <option value="1AC">1AC</option>
    </select>

    <div id="price">Total Price: ₹0</div>

    <button type="submit" class="submit-btn">Book Ticket</button>
  </form>

<script>
  const stations = [
    "Mumbai Central", "Delhi Junction", "Bangalore City", "Chennai Central", "Hyderabad Deccan",
    "Howrah Junction", "Ahmedabad Junction", "Pune Junction", "Jaipur Junction", "Lucknow Charbagh",
    "Chandigarh", "Bhopal Junction", "Goa Madgaon", "Kochi Ernakulam", "Amritsar Junction",
    "Indore Junction", "Visakhapatnam Junction", "Nagpur Junction", "Patna Junction", "Guwahati Junction"
  ];

  const fromStationSelect = document.getElementById('fromStation');
  const toStationSelect = document.getElementById('toStation');

  stations.forEach(station => {
    let optionFrom = document.createElement('option');
    optionFrom.value = station;
    optionFrom.text = station;
    fromStationSelect.add(optionFrom);

    let optionTo = document.createElement('option');
    optionTo.value = station;
    optionTo.text = station;
    toStationSelect.add(optionTo);
  });

  function updatePassengerFields() {
    const numPassengers = parseInt(document.getElementById('passengers').value) || 1;
    const passengerNamesDiv = document.getElementById('passengerNames');
    const passengerInputFields = document.getElementById('passengerInputFields');
    
    passengerInputFields.innerHTML = '';
    passengerNamesDiv.style.display = 'none';

    if (numPassengers > 0) {
      passengerNamesDiv.style.display = 'block';
      for (let i = 1; i <= numPassengers; i++) {
        const inputField = document.createElement('div');
        inputField.innerHTML = `

          <label for="passenger${i}">Passenger ${i} Name</label>
          <input type="text" id="passenger${i}" name="passenger${i}" placeholder="Enter name" required>
        `;
        passengerInputFields.appendChild(inputField);
      }
    }
  }

  function calculateTrainPrice() {
    const from = document.getElementById('fromStation').value;
    const to = document.getElementById('toStation').value;
    const passengers = parseInt(document.getElementById('passengers').value) || 1;
    const classType = document.getElementById('classType').value;

    if (from && to && from !== to && classType) {
      let basePrice = Math.floor(Math.random() * (1500 - 500 + 1)) + 500; // Random ₹500-₹1500
      let multiplier = 1;

      if (classType === "3AC") multiplier = 1.5;
      if (classType === "2AC") multiplier = 2;
      if (classType === "1AC") multiplier = 2.5;

      let totalPrice = basePrice * multiplier * passengers;

      document.getElementById('price').innerText = "Total Price: ₹" + totalPrice.toFixed(0);
    } else {
      document.getElementById('price').innerText = "Total Price: ₹0";
    }
  }

  function goToLoadingPage() {
    // Gather form data
    const fromStation = document.getElementById('fromStation').value;
    const toStation = document.getElementById('toStation').value;
    const travelDate = document.getElementById('date').value;
    const passengers = document.getElementById('passengers').value;
    const classType = document.getElementById('classType').value;
    const passengerNames = [];

    // Collect passenger names if applicable
    for (let i = 1; i <= passengers; i++) {
      const passengerName = document.getElementById(`passenger${i}`).value;
      passengerNames.push(passengerName);
    }

    // Calculate total price
    const priceText = document.getElementById('price').innerText;
    const totalPrice = priceText.replace('Total Price: ₹', '').trim();

    // Create a data object
    const bookingData = {
      fromStation,
      toStation,
      travelDate,
      passengers,
      classType,
      passengerNames,
      totalPrice
    };

    // Store data in localStorage
    localStorage.setItem('trainBookingData', JSON.stringify(bookingData));

    // Redirect to the loading page or directly to the receipt page
    window.location.href = "trainreceipt.html"; // Or you can redirect to "receipt.html"
    return false;
  }
</script>
<script>
  // Preloader removal
  window.addEventListener('load', () => {
    const preloader = document.getElementById('preloader');
    preloader.style.opacity = '0';
    preloader.style.transition = 'opacity 0.5s ease';
    setTimeout(() => {
      preloader.style.display = 'none';
    }, 500); // Wait for the fade-out transition
  });
</script>

</body>
</html>
