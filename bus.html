<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus Ticket Booking</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .booking-form {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 550px;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-size: 50px;
      font-family: 'Tangerine', serif;
      border-bottom: #ffa751 solid 3px;
      border-radius: 10%;
    }

    label {
      font-size: 16px;
      color: #555;
      margin-bottom: 8px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      transition: 0.3s;
    }

    input:focus, select:focus {
      border-color: #ffa751;
      box-shadow: 0 0 8px rgba(255, 167, 81, 0.5);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      border: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.4s;
      box-shadow: 0 10px 20px rgba(255, 126, 95, 0.5);
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #feb47b, #ff7e5f);
      transform: scale(1.05);
    }

    #price {
      text-align: center;
      font-size: 20px;
      color: #444;
      margin-bottom: 20px;
      font-weight: bold;
    }

    #passengerNames {
      margin-bottom: 20px;
    }
        /* Preloader Styles */
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #e0f7ff, #d0eaff, #f0f9ff);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #cce7ff;
  border-top: 6px solid #007bff; /* Blue spinner color */
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
  </style>
</head>

<body>
    <!-- Preloader -->
<div id="preloader">
  <div class="spinner"></div>
</div>


  <form class="booking-form" onsubmit="return goToLoadingPage()" method="POST">
    <h2>Bus Ticket Booking</h2>

    <label for="fromCity">From City</label>
    <select id="fromCity" name="fromCity" required onchange="calculateBusPrice()">
      <option value="" disabled selected>Select Departure City</option>
    </select>

    <label for="toCity">To City</label>
    <select id="toCity" name="toCity" required onchange="calculateBusPrice()">
      <option value="" disabled selected>Select Destination City</option>
    </select>

    <label for="date">Travel Date</label>
    <input type="date" id="date" name="date" required>

    <label for="passengers">Passengers</label>
    <select id="passengers" name="passengers" required onchange="updatePassengerFields(); calculateBusPrice()">
      <option value="" disabled selected>Select passengers</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4+</option>
    </select>

    <div id="passengerNames" style="display:none;">
      <div id="passengerInputFields"></div>
    </div>

    <label for="busType">Bus Type</label>
    <select id="busType" name="busType" required onchange="calculateBusPrice()">
      <option value="" disabled selected>Select Bus Type</option>
      <option value="Non-AC">Non-AC</option>
      <option value="AC">AC</option>
      <option value="Sleeper">Sleeper</option>
      <option value="AC Sleeper">AC Sleeper</option>
    </select>

    <div id="price">Total Price: ₹0</div>

    <button type="submit" class="submit-btn">Book Ticket</button>
  </form>

<script>
  const cities = [
    "Mumbai", "Delhi", "Bangalore", "Chennai", "Hyderabad",
    "Pune", "Jaipur", "Lucknow", "Chandigarh", "Goa",
    "Kolkata", "Ahmedabad", "Bhopal", "Kochi", "Amritsar",
    "Indore", "Nagpur", "Patna", "Guwahati", "Visakhapatnam"
  ];

  const fromCitySelect = document.getElementById('fromCity');
  const toCitySelect = document.getElementById('toCity');

  cities.forEach(city => {
    let optionFrom = document.createElement('option');
    optionFrom.value = city;
    optionFrom.text = city;
    fromCitySelect.add(optionFrom);

    let optionTo = document.createElement('option');
    optionTo.value = city;
    optionTo.text = city;
    toCitySelect.add(optionTo);
  });

  function updatePassengerFields() {
    const numPassengers = parseInt(document.getElementById('passengers').value) || 1;
    const passengerNamesDiv = document.getElementById('passengerNames');
    const passengerInputFields = document.getElementById('passengerInputFields');
    
    passengerInputFields.innerHTML = '';
    passengerNamesDiv.style.display = 'none';

    if (numPassengers > 0) {
      passengerNamesDiv.style.display = 'block';
      for (let i = 1; i <= numPassengers; i++) {
        const inputField = document.createElement('div');
        inputField.innerHTML = ` 
          <label for="passenger${i}">Passenger ${i} Name</label>
          <input type="text" id="passenger${i}" name="passenger${i}" placeholder="Enter name" required> 
        `;
        passengerInputFields.appendChild(inputField);
      }
    }
  }

  function calculateBusPrice() {
    const from = document.getElementById('fromCity').value;
    const to = document.getElementById('toCity').value;
    const passengers = parseInt(document.getElementById('passengers').value) || 1;
    const busType = document.getElementById('busType').value;

    if (from && to && from !== to && busType) {
      let basePrice = Math.floor(Math.random() * (1200 - 300 + 1)) + 300; // Random ₹300-₹1200
      let multiplier = 1;

      if (busType === "AC") multiplier = 1.3;
      if (busType === "Sleeper") multiplier = 1.5;
      if (busType === "AC Sleeper") multiplier = 1.8;

      let totalPrice = basePrice * multiplier * passengers;

      document.getElementById('price').innerText = "Total Price: ₹" + totalPrice.toFixed(0);
    } else {
      document.getElementById('price').innerText = "Total Price: ₹0";
    }
  }

  function goToLoadingPage() {
    const fromCity = document.getElementById('fromCity').value;
    const toCity = document.getElementById('toCity').value;
    const travelDate = document.getElementById('date').value;
    const passengers = document.getElementById('passengers').value;
    const busType = document.getElementById('busType').value;
    const passengerNames = [];

    for (let i = 1; i <= passengers; i++) {
      const passengerName = document.getElementById(`passenger${i}`).value;
      passengerNames.push(passengerName);
    }

    const priceText = document.getElementById('price').innerText;
    const totalPrice = priceText.replace('Total Price: ₹', '').trim();

    const bookingData = {
      fromCity,
      toCity,
      travelDate,
      passengers,
      busType,
      passengerNames,
      totalPrice
    };

    localStorage.setItem('busBookingData', JSON.stringify(bookingData));

    window.location.href = "busreceipt.html"; // Redirect to the receipt page
    return false;
  }
</script>
<script>
  // Preloader removal
  window.addEventListener('load', () => {
    const preloader = document.getElementById('preloader');
    preloader.style.opacity = '0';
    preloader.style.transition = 'opacity 0.5s ease';
    setTimeout(() => {
      preloader.style.display = 'none';
    }, 500); // Wait for the fade-out transition
  });
</script>

</body>
</html>
